<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gymnasium</title>

<style>
h1 {text-align: center;}
body {
  background-color: navy;
  color: white;
}
button {
background-color: white;
color: black;
height: 20px;

}

.myDiv {
  margin: 10px;
  padding: 10px;
  border: 10px outset white;
  border-radius: 25px;
  width: 250px !important;
  color: white;
  }

.containerdiv {
    display: flex;
    flex-wrap: wrap;
    }
</style>
    <script src="hjbhjbhj.js"></script>
</head>
<body>
<h1>Hitta gymnasiet</h1>
<label for="search">Sök gymnasieskolor:</label>
          <input type="text" id="search" name="search" placeholder="Ange skolnamn...">
          <button type="button" onclick="GetSchools()"></button>


<div id="ListOfSchools" class="containerdiv"> </div>


 <div>
        <label for="year">År:</label>
        <select id="year">
          <option value="2025" selected>2025</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
          <option value="2022">2022</option>
          <option value="2021">2021</option>
          <option value="2020">2020</option>
          <option value="2019">2019</option>
          <option value="2018">2018</option>
        </select>
      </div>


      <div >
        <label for="sortBy">Sortera:</label>
        <select id="sortBy">
          <option value="skola" selected>Namn</option>
          <option value="antagningsgräns_prelim">Antagningsgräns Prelim</option>
          <option value="antagningsgräns_final">Antagningsgräns Final</option>
          <option value="median_prelim">Median Prelim</option>
          <option value="median_final">Median Final</option>
          <option value="studieväg">Studieväg</option>
        </select>
      </div>

 <div>
        <label>Sortera:</label>
        <div>
          <input type="radio" id="asc" name="SortOrder" value="asc" checked>
          <label for="asc">Stigande</label>

          <input type="radio" id="desc" name="SortOrder" value="desc">
          <label for="desc">Fallande</label>
        </div>

   </div>



 <div>
        <label for="program">Studieväg:</label>
        <select id="program" size="1" multiple>
          <option value="natur" selected>Natur</option>
          <option value="sam">Samhäll</option>
          <option value="ek">Ekonomi</option>
          <option value="estet">Estet</option>
          <option value="teknik">Teknik</option>
          <option value="el">El och energi</option>
          <option value="naturbruk">Naturbruk</option>
          <option value="barn och">Barn och fritid</option>
          <option value="försäljnings och">Försäljnings och Service</option>
          <option value="fordon">Fordon och transport</option>
          <option value="frisör">Frisör och stylist</option>
          <option value="hu">Humanistiska</option>
          <option value="bygg">Bygg och anläggning</option>
          <option value="vård">Vård och omsorg</option>
          <option value="res">Restaurang och livsmedel</option>
          <option value="international">International Baccalaureate</option>
          <option value="vvs och fastighet">VVS och fastighet</option>
          <option value="hotell">Hotell och turism</option>
          <option value="introduktion">Introduktion</option>
          <option value="industritekniska">Industritekniska</option>
          <option value="sjöfart">Sjöfart</option>
          <option value="marinteknik">Marinteknik</option>
          <option value="yrkesdans">Yrkesdans</option>
          <option value="flygteknik">Flygteknik</option>
        </select>
      </div>

 <div>
        <label for="radius" class="form-label">Radie (km):</label>
        <input type="number" id="radius" class="form-control">
 </div>


 <div>
        <label for="minPrelimMerit">Preliminär minimum merit:</label>
        <input type="number" id="minPrelimMerit" class="form-control" value="0" min="0" max="335">
      </div>

      <div>
        <label for="maxPrelimMerit" >Preliminär maximal merit:</label>
        <input type="number" id="maxPrelimMerit" value="340" min="0" max="340">
      </div>

   <div >
      <button onclick="getLocation(getGymnasiumWithinRadius)" type="button">Få gymnasiet inom
        radie</button>
       <div id="location"></div>
</div>

<button onclick="previouspage()" type="button">Förra sida</button>
<button onclick="nextpage()" type="button">Nästa sida</button>

<div id="schools" class="containerdiv"> </div>

</body>
</html>
